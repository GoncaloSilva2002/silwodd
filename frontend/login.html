<!DOCTYPE html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Silwood — Entrar</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body class="login-page">
    <main class="login-shell">
      <section class="login-card">
        <div class="login-brand">
          <img src="/images.png" alt="Silwood" />
          <div>
            <span class="eyebrow">Gestão de produção</span>
            <h1>Bem-vindo</h1>
          </div>
        </div>
        <p class="muted login-intro">Inicia sessão para acompanhar obras, materiais e etapas.</p>

        <form id="login-form">
          <div class="form-field">
            <label for="username">Username</label>
            <input id="username" name="username" autocomplete="username" required />
          </div>
          <div class="form-field">
            <label for="password">Password</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required />
          </div>
          <button type="submit" class="login-submit">Entrar</button>
        </form>

        <p id="login-error" class="error hidden"></p>
      </section>
    </main>
    <script src="/login.js"></script>
  </body>
</html>
