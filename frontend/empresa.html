<!DOCTYPE html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="api-base-url" content="" />
    <meta name="theme-color" content="#0f172a" />
    <title>Painel Silwood</title>
    <link rel="stylesheet" href="/empresa-tv.css" />
  </head>
  <body class="tv-page">
    <header class="tv-header">
      <img src="/silwood-logo-completo-branco.png" class="tv-logo" alt="Silwood" />
      <time id="tv-clock" class="tv-clock"></time>
    </header>

    <main id="tv-slides">
      <section class="tv-slide active tv-stage-slide" data-stage="corte">
        <h1>Corte</h1><div class="tv-content"><div class="tv-column" data-column="1"></div><div class="tv-column" data-column="2"></div></div>
      </section>
      <section class="tv-slide tv-stage-slide" data-stage="orlar">
        <h1>Orlar</h1><div class="tv-content"><div class="tv-column" data-column="1"></div><div class="tv-column" data-column="2"></div></div>
      </section>
      <section class="tv-slide tv-stage-slide" data-stage="cnc">
        <h1>CNC</h1><div class="tv-content"><div class="tv-column" data-column="1"></div><div class="tv-column" data-column="2"></div></div>
      </section>
      <section class="tv-slide tv-stage-slide" data-stage="montagem_fabrica">
        <h1>Montagem Fábrica</h1><div class="tv-content"><div class="tv-column" data-column="1"></div><div class="tv-column" data-column="2"></div></div>
      </section>
      <section class="tv-slide tv-stage-slide" data-stage="pintura">
        <h1>Pintura</h1><div class="tv-content"><div class="tv-column" data-column="1"></div><div class="tv-column" data-column="2"></div></div>
      </section>
      <section class="tv-slide tv-stage-slide" data-stage="montagem_obra">
        <h1>Montagem Obra</h1><div class="tv-content"><div class="tv-column" data-column="1"></div><div class="tv-column" data-column="2"></div></div>
      </section>
      <section class="tv-slide tv-stage-slide tv-conditional-slide" data-stage="embalar">
        <h1>Embalar</h1><div class="tv-content"><div class="tv-column" data-column="1"></div><div class="tv-column" data-column="2"></div></div>
      </section>
      <section class="tv-slide tv-stage-slide tv-conditional-slide" data-stage="inicio_obra">
        <h1>Início de Obra</h1><div class="tv-content"><div class="tv-column" data-column="1"></div><div class="tv-column" data-column="2"></div></div>
      </section>
      <section class="tv-slide tv-stage-slide tv-conditional-slide" data-stage="camiao">
        <h1>Carregar Camião</h1><div class="tv-content"><div class="tv-column" data-column="1"></div><div class="tv-column" data-column="2"></div></div>
      </section>
      <section class="tv-slide tv-stage-slide tv-conditional-slide" data-stage="obra">
        <h1>Fim de Obra</h1><div class="tv-content"><div class="tv-column" data-column="1"></div><div class="tv-column" data-column="2"></div></div>
      </section>

      <section class="tv-slide tv-calendar-slide" data-calendar-view="semanas">
        <h1>Semanas do mês</h1>
        <div class="tv-calendar-toolbar">
          <strong class="tv-calendar-period"></strong>
          <div>
            <button type="button" data-tv-step="-1" aria-label="Mês anterior">←</button>
            <button type="button" data-tv-step="today">Mês atual</button>
            <button type="button" data-tv-step="1" aria-label="Mês seguinte">→</button>
          </div>
        </div>
        <div class="tv-calendar-root"></div>
      </section>
      <section class="tv-slide tv-calendar-slide" data-calendar-view="mes">
        <h1>Calendário mensal</h1>
        <div class="tv-calendar-toolbar">
          <strong class="tv-calendar-period"></strong>
          <div>
            <button type="button" data-tv-step="-1" aria-label="Mês anterior">←</button>
            <button type="button" data-tv-step="today">Mês atual</button>
            <button type="button" data-tv-step="1" aria-label="Mês seguinte">→</button>
          </div>
        </div>
        <div class="tv-calendar-root"></div>
      </section>
      <section class="tv-slide tv-calendar-slide" data-calendar-view="ano">
        <h1>Calendário anual</h1>
        <div class="tv-calendar-toolbar">
          <strong class="tv-calendar-period"></strong>
          <div>
            <button type="button" data-tv-step="-1" aria-label="Ano anterior">←</button>
            <button type="button" data-tv-step="today">Ano atual</button>
            <button type="button" data-tv-step="1" aria-label="Ano seguinte">→</button>
          </div>
        </div>
        <div class="tv-calendar-root"></div>
      </section>

    </main>

    <p id="tv-error" class="tv-error" role="alert"></p>

    <nav class="tv-navigation" aria-label="Páginas do painel">
      <button type="button" id="tv-previous" aria-label="Página anterior">←</button>
      <button type="button" id="tv-pause">Pausar</button>
      <button type="button" id="tv-next" aria-label="Página seguinte">→</button>
      <span id="tv-page-count"></span>
    </nav>

    <aside class="tv-legend" aria-label="Legenda">
      <div><span class="tv-legend-box tv-ok"></span>Dentro do planeado</div>
      <div><span class="tv-legend-box tv-aviso"></span>Atrasado</div>
      <div><span class="tv-legend-box tv-problema"></span>Urgente</div>
      <div><span class="tv-legend-box tv-especial"></span>Férias / Pontes / Feriados</div>
      <div><span class="tv-legend-box tv-trabalho"></span>Trabalho</div>
    </aside>

    <script src="/config.js"></script>
    <script src="/calendar.js"></script>
    <script src="/empresa-tv.js"></script>
  </body>
</html>
